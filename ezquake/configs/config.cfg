alias .stp.youtake.dm2       "if ('$location' =~ '^(low\-stairs|low\-lift|low\-button)$') then .stp.youtake.tprl else if ('$location' =~ '^(floating)$') then .stp.youtake.tpmh"
alias .stp.youtake.dm3       "if ('$location' =~ '^(sng\-ledge|hill)$') then .stp.youtake.tpmega else if ('$location' =~ '^(water)$') then .stp.youtake.tplg"
alias .stp.youtake.e1m2      "if ('$location' =~ '^([^\-]+)\-([^\-]+)$') then .stp.youtake.item.2 else if ('$location' =~ '^(bridge|bridge\-room)$') then .stp.youtake.tpga"
