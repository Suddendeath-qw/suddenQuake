alias .stp.took              "if ('$took' == '$tp_name_nothing') then .not else if ('$took' isin '$tp_name_ring $tp_name_pent $tp_name_quad') then .stp.team.powerupelse if ('$took' isin '$tp_name_backpack $bestweapon' AND $health < 1) then .stp.took.died else if ('$took' isin '$tp_name_rl $tp_name_lg' AND '$bestweapon' !isin '$tp_name_rl $tp_name_lg') then .stp.took.died else if ('$tp_name_backpack' == '$took') then .stp.took.pack else .stp.took.any"
alias .stp.took.any          ".tsay.took.any"
alias .stp.took.died         ".tsay.took.died"
alias .stp.took.pack         "if ('$bestweapon' isin '$tp_name_rl $tp_name_lg') then .stp.took.any else .tsay.took.nopack"
