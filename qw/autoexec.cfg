bind ? "stp_lost"
bind ? "stp_aol stp_safe"
bind ? "stp_smart"
bind ? "stp_point"

// SHOULD
bind ? "stp_powerup"

// OPTIONAL
bind ? "stp_dropped"
bind ? "stp_aol stp_help"
bind ? "stp_aol stp_replace"
bind ? "stp_status"
bind ? "stp_wpkilled"
bind ? "stp_youtake"
bind ? "stp_enemy_quad"
bind ? "stp_enemy_quad_ok98"
bind ? "stp_enemy_pent"
bind ? "stp_enemy_ring"
bind ? "stp_get_quad"
bind ? "stp_get_pent"


