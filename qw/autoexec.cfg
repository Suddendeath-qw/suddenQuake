exec frogbot // From frogbot.pk3
exec suddenconfig

////////////////////////////////////////////////////////////////////////////////////////////////////
//                                                                                                //
//                                          P R O F I L E                                         //
//                                                                                                //
////////////////////////////////////////////////////////////////////////////////////////////////////

alias showprofile "echo;echo name: $name; echo nick: $nick; echo team: $team; echo color: $topcolor $bottomcolor; echo skin: $skin;echo"

// Authentication
cl_username "rio"
alias on_enter "authenticate"

// Defaults
name "rio"
team "^-s^-"
color 0 12
set nick "{&cf13rio:&r}"
skin "base"

// 4on4
alias team_s1   "name $name; team ^-s^-; color 0 12; skin $skin; nick $nick; showprofile"
alias team_s2   "name $name; team ^=s^=; color 0 12; skin $skin; nick $nick; showprofile"
alias team_swe  "name $name; team swe; color 12 13; skin $skin; nick $nick; showprofile"
alias fakenick  "name %1; team $qt$qt; color 0 0; set nick %1; skin %1; showprofile"


////////////////////////////////////////////////////////////////////////////////////////////////////
//                                                                                                //
//                                      S E T T I N G S                                           //
//                                                                                                //
////////////////////////////////////////////////////////////////////////////////////////////////////

ruleset smackdown
in_builtinkeymap "0" // 0 = use windows kb layout, 1 = use quake keyboard
cl_pext_floatcoords 1
cl_staticSounds 0


////////////////////////////////////////////////////////////////////////////////////////////////////
//                                                                                                //
//                                  M I S C .   A L I A S E S                                     //
//                                                                                                //
////////////////////////////////////////////////////////////////////////////////////////////////////

// Download .loc files for the current map from the server if it exists, and then load them.
alias locdl "download locs/$mapname.loc; wait; wait; wait; loadloc $mapname"

// Cointoss - choose which team starts to pick map
alias cointoss "cmd rnd $qt$team1$qt $qt$team2$qt"

// rnd alias - useful for generating random numbers
set __intmax "10000000"
alias __r.app "set %1 $%1%2"
alias __r.rnd "set_calc __r $rand * %1; __r.ro"
alias __r.ro "set_calc __r2 $__r + $__intmax; set_calc __r2 $__r2 - $__intmax; __r.fl"
alias __r.fl "if ($__r2 > $__r) then set_calc __r $__r2 - 1 else set __r $__r2"
alias __r.clr "__r.rnd 999; wait; if ($__r < 10) then __r.app %1 {&c00$__r%2&r} else if ($__r < 100) then __r.app %1 {&c0$__r%2&r} else __r.app %1 {&c$__r%2&r}"

// Crosshair color (r - Red, g - Green, b - Blue, c- Cyan, m - Magenta, y - Yellow, k - Black, w - white)
alias xhair "set xhairc %1; xhair_$xhairc"
alias xhair_w "crosshaircolor 255 255 255"
alias xhair_c "crosshaircolor 0 255 255"
alias xhair_m "crosshaircolor 255 0 255"
alias xhair_y "crosshaircolor 255 255 0"
alias xhair_k "crosshaircolor 0 0 0"
alias xhair_r "crosshaircolor 255 0 0"
alias xhair_g "crosshaircolor 0 255 0"
alias xhair_b "crosshaircolor 0 0 255"

// Toggle Lego-quake texture mode
alias lego_on "gl_texturemode gl_nearest; gl_picmip 1; gl_max_size 16; gl_miptexlevel 3"
alias lego_off "gl_texturemode gl_linear_mipmap_linear;gl_picmip 0; gl_max_size 32768; gl_mipTexLevel 0"
alias lego "if (%1 == 1) then lego_on else lego_off"

// Combined netgraph and scores
alias +net_scores "show netgraph; +showscores"
alias -net_scores "hide netgraph; -showscores"

// Improved +wp_stats (+wp_stats2)                               
////////////////////////////////////////////////////////////////////////////////////////////////////

hud_weaponstats_place "screen"
hud_weaponstats_align_x "center"
hud_weaponstats_align_y "center"
hud_weaponstats_pos_y "20"

set _.str.wpformat ""
alias _.wp.app "if ('$_.str.wpformat' == '') then set _.str.wpformat $_.str.wpformat%1 else set _.str.wpformat $_.str.wpformat$x20%1"
alias _.wp.format "set _.str.wpformat $qt$qt; if ('$mapname' isin 'e1m2 dm2') then _.wp.srl else if ('$mapname' isin 'end oldcrat midair') then _.wp.rl else if ('$mapname' isin 'dmm4b') then _.wp.lg else if ('$mapname' isin 'povdmm4') then _.wp.rlg else _.wp.default"

// Assign based on mapname
alias _.wp.default "_.wp.sg; _.wp.rl; _.wp.lg"
alias _.wp.srl "_.wp.sg; _.wp.rl"
alias _.wp.slg "_.wp.sg; _.wp.lg"
alias _.wp.rlg "_.wp.rl; _.wp.lg"

alias _.wp.sg "_.wp.app &cff6sg&r:$x252"
alias _.wp.rl "_.wp.app &cf66rl&r:#7"
alias _.wp.lg "_.wp.app &c29flg&r:$x258"

alias +wp_stats2 "_.wp.format; hud_weaponstats_format $_.str.wpformat; hud_weaponstats_show 1"
alias -wp_stats2 "hud_weaponstats_show 0"

////////////////////////////////////////////////////////////////////////////////////////////////////
//                                                                                                //        
//                                      V O L U M E                                               //
//                                                                                                //
////////////////////////////////////////////////////////////////////////////////////////////////////

set vol.min 0
set vol.max 0.1
set vol.step 0.01
set vol.now 0
set vol.temp 0
set vol.save 0
set vol.str ""
set vol.n 0

alias vol_clamp "if ($%1 < %2) then set %1 %2 else if ($%1 > %3) then set %1 %3"
alias vol "set vol.temp %1; vol_clamp vol.temp $vol.min $vol.max; wait; set vol.now $vol.temp; volume $vol.temp; vol.print"
alias vol- "set vol.temp $vol.now; inc vol.temp -$vol.step; vol $vol.temp"
alias vol+ "set vol.temp $vol.now; inc vol.temp +$vol.step; vol $vol.temp"
alias volm "if ($vol.now > 0 && $volume > 0) then volm1 else volm2"
alias volm1 "set vol.save $vol.now; vol 0;wait;wait; set vol.now $vol.save; set vol.save 0"
alias volm2 "if ($vol.now == 0) then set vol.now $vol.step; vol $vol.now; set vol.save 0"

// "$x80 ("
// "$x81 ==="
// "$x82 )"
// "$x83 =*="
alias vol.app "set vol.str $vol.str%1"
alias vol.print "set vol.str $qt$qt; set vol.n 0; vol.print0"
alias vol.print0 "vol.app vol$x20$x80; vol.print1"
alias vol.print1 "inc vol.n +$vol.step; if ($vol.n > $vol.max) then vol.print2 else if ($vol.n == $vol.now) then vol.print1a else vol.print1b"
alias vol.print1a "vol.app $x83; vol.print1"
alias vol.print1b "vol.app $x81; vol.print1"
alias vol.print2 "vol.app $x82$x20; if ($vol.now == 0) then vol.app m else vol.app $vol.now; if ($vol.now == 0) then set vol.str &c855$vol.str; echo $vol.str"

vol 0.05


////////////////////////////////////////////////////////////////////////////////////////////////////
//                                                                                                //
//                                  BASIC WEAPON SCRIPT USING IMPULSE                             //
//                                        (ALSO WORKS IN CTF)                                     //
//                                                                                                //
////////////////////////////////////////////////////////////////////////////////////////////////////

/// Weapon Priority
alias i_weapon  ""
alias i_weapon1 "impulse 1"             // AXE
alias i_weapon2 "impulse 2 1"           // SG, AXE
alias i_weapon3 "impulse 3 2 1"         // SSG, SG, AXE
alias i_weapon4 "impulse 4 5 3 2 1"     // NG, SNG, SSG, SG, AXE
alias i_weapon5 "impulse 5 4 3 2 1"     // SNG, NG, SSG, SG, AXE
alias i_weapon6 "impulse 6 5 3 4 2 1"   // GL, SNG, SSG, NG, SG, AXE
alias i_weapon7 "impulse 7 5 3 4 2 1"   // RL, SNG, SSG, NG, SG, AXE
alias i_weapon8 "impulse 8 5 3 4 2 1"   // LG, SNG, SSG, NG, SG, AXE
alias i_weapon9 "impulse 22"            // HOOK
alias i_weapon0 "i_weapon2"             // Default setting

alias +fire_axe "i_weapon1; +attack"
alias -fire_axe "-attack; i_weapon2"
alias +fire_sg "i_weapon2; +attack"
alias -fire_sg "-attack; i_weapon2"
alias +fire_ssg "i_weapon3; +attack"
alias -fire_ssg "-attack; i_weapon2"
alias +fire_ng "i_weapon4; +attack"
alias -fire_ng "-attack; i_weapon2"
alias +fire_sng "i_weapon5; +attack"
alias -fire_sng "-attack; i_weapon2"
alias +fire_gl "i_weapon6; +attack"
alias -fire_gl "-attack; i_weapon2"
alias +fire_rl "i_weapon7; +attack"
alias -fire_rl "-attack; i_weapon2"
alias +fire_lg "i_weapon8; +attack"
alias -fire_lg "-attack; i_weapon2"
alias +fire_hk "i_weapon9; +attack"
alias -fire_hk "-attack; i_weapon2"
 
// Fire selected weapon
alias +select_fire "i_weapon0; +attack"
alias -select_fire "-attack; i_weapon2"
                                
alias select_axe    "alias i_weapon0 i_weapon1; echo &cfff$d AXE" // select AXE
alias select_sg     "alias i_weapon0 i_weapon2; echo &c880$d SG " // select SG     (AXE)
alias select_ssg    "alias i_weapon0 i_weapon3; echo &cff0$d SSG" // select SSG    (SG, AXE)
alias select_ng     "alias i_weapon0 i_weapon4; echo &c808$d NG"  // select NG     (SNG, SSG, SG, AXE)
alias select_sng    "alias i_weapon0 i_weapon5; echo &cf0f$d SNG" // select SNG    (NG, SSG, SG, AXE)
alias select_gl     "alias i_weapon0 i_weapon6; echo &c0f0$d GL"  // select GL     (SNG, SSG, NG, SG, AXE)
alias select_rl     "alias i_weapon0 i_weapon7; echo &cf00$d RL"  // select RL     (SNG, SSG, NG, SG, AXE)
alias select_lg     "alias i_weapon0 i_weapon8; echo &c00f$d LG"  // select LG     (SNG, SSG, NG, SG, AXE)
alias select_hk     "alias i_weapon0 i_weapon9; echo &cfff$d HOOK" // select HOOK  (HOOK)

alias +rljump   "+fire_rl;+jump"
alias -rljump   "-fire_rl;-jump"


////////////////////////////////////////////////////////////////////////////////////////////////////
//                                                                                                //
//                                    K E Y   B I N D I N G S                                     //
//                                                                                                //
////////////////////////////////////////////////////////////////////////////////////////////////////

bind TAB "+net_scores"
bind F8  "vol-"
bind F9  "vol+"
bind F10 "volm"

// Basic Movement
////////////////////////////////////////////////////////////////////////////////////////////////////

bind w "+forward"
bind a "+moveleft"
bind s "+back"
bind d "+moveright"
bind space "+jump"

// Weapons
////////////////////////////////////////////////////////////////////////////////////////////////////

// Fire button for select fire
bind mouse1 "+select_fire"

bind x "+fire_axe"         // fire AXE    (AXE)
bind c "+fire_sg"          // fire SG     (SG, AXE)
bind CTRL "+fire_ssg"      // fire SSG    (SSG, SG, AXE)
//bind x "+fire_sng"       // fire SNG    (SNG,NG, SSG, SG, AXE)
bind ALT "+fire_gl"        // fire GL     (GL, SNG, SSG, NG, SG, AXE)
bind mouse2 "+fire_rl"     // fire RL     (RL, SNG, SSG, NG, SG, AXE)
//bind x "+fire_lg"        // fire LG     (LG, SNG, SSG, NG, SG, AXE)
bind mouse4 "+fire_hook"

//bind 1 "select_axe"       // select AXE    (AXE)
//bind 2 "select_sg"        // select SG     (SG, AXE)
bind r "select_ssg"         // select SSG    (SSG, SG, AXE)
//bind 4 "select_ng"        // select NG     (NG, SNG, SSG, SG, AXE)
bind q "select_sng"         // select SNG    (SNG, NG, SSG, SG, AXE)
//bind 6 "select_gl"        // select GL     (GL, SNG, SSG, NG, SG, AXE)
//bind 7 "select_rl"        // select RL     (RL, SNG, SSG, NG, SG, AXE)
bind e "select_lg"          // select LG     (LG, SNG, SSG, NG, SG, AXE)
bind f "select_hook"        // select HOOK   (HOOK, AXE)

// Rocket-jump (just a simple fire rocket + jump bind)
bind v "+rljump"


